name: Daily AI Article

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: S1 Collect (search)
        run: python scripts/search.py
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_TOPICS: ${{ vars.SEARCH_TOPICS }}

      - name: S2 Plan
        run: python scripts/plan.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}

      - name: S4 Generate cover
        run: python scripts/gen_cover.py

      - name: S5 Upload cover to WeChat
        if: hashFiles('output/cover.png') != ''
        run: |
          TOKEN=$(curl -s -X POST "https://api.abeiyun.com/www/break.php?cmd=visit_sysdomain&password=${WX_UNLOCK_PASSWORD}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Referer: http://${WX_SERVER_HOST}/" \
            -d "x=1" | grep -oP '(?<=<errMsg>)[^<]+')
          MEDIA_ID=$(curl -s -X POST "http://${WX_SERVER_HOST}/upload?type=material" \
            -H "X-Shared-Secret: ${WX_SHARED_SECRET}" \
            -H "Cookie: zhujiwusysdomain=${TOKEN}" \
            -F "file=@output/cover.png" | python3 -c "import sys,json; print(json.load(sys.stdin).get('media_id',''))")
          if [ -n "$MEDIA_ID" ]; then
            python3 -c "
import json
with open('output/article.json') as f: d = json.load(f)
d['articles'][0]['thumb_media_id'] = '$MEDIA_ID'
with open('output/article.json','w') as f: json.dump(d, f, ensure_ascii=False, indent=2)
print('cover media_id:', '$MEDIA_ID')
"
          fi
        env:
          WX_SERVER_HOST: ftp6310437.host109.abeiyun.cn
          WX_SHARED_SECRET: ${{ secrets.WX_SHARED_SECRET }}
          WX_UNLOCK_PASSWORD: ${{ secrets.WX_UNLOCK_PASSWORD }}

      - name: S3 Write
        run: python scripts/write.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ARTICLE_AUTHOR: ${{ vars.ARTICLE_AUTHOR }}
          ARTICLE_DIGEST: ${{ vars.ARTICLE_DIGEST }}

      - name: S7 Verify report
        run: python scripts/report.py

      - name: S6 Save draft to WeChat
        if: hashFiles('output/article.json') != ''
        run: |
          node scripts/wechat-publish.js \
            --server "$WX_SERVER" \
            --secret "$WX_SHARED_SECRET" \
            --appid "$WX_APPID" \
            --appsecret "$WX_APPSECRET" \
            --unlock-password "$WX_UNLOCK_PASSWORD" \
            --file output/article.json
        env:
          WX_SERVER: ${{ secrets.WX_SERVER }}
          WX_SHARED_SECRET: ${{ secrets.WX_SHARED_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_UNLOCK_PASSWORD: ${{ secrets.WX_UNLOCK_PASSWORD }}

      - name: Commit article
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add output/
          git commit -m "daily article $(date +%F)" || echo "nothing to commit"
          git push
