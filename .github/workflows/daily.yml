name: Daily AI Article

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow + CJK font
        run: |
          pip install Pillow
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: S1 Collect
        run: python scripts/search.py
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_TOPICS: ${{ vars.SEARCH_TOPICS }}

      - name: S2 Plan
        run: python scripts/plan.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}

      - name: S3 Write
        run: python scripts/write.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ARTICLE_AUTHOR: ${{ vars.ARTICLE_AUTHOR }}
          ARTICLE_DIGEST: ${{ vars.ARTICLE_DIGEST }}

      - name: S4 Generate cover
        run: python scripts/gen_cover.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: S5 Generate article images
        run: python scripts/gen_article_images.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Commit images for CDN
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -f output/cover.jpg output/images/
          git diff --cached --quiet && echo "no image changes" || git commit -m "images $(date +%F)" && git push
          echo "IMG_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: S6 Fill image URLs + thumb
        run: |
          COVER_URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$IMG_COMMIT/output/cover.jpg"
          python -c "
          import json, os
          with open('output/article.json') as f: d = json.load(f)
          d['articles'][0]['thumb_url'] = os.environ['COVER_URL']
          d['articles'][0]['show_cover_pic'] = 1
          with open('output/article.json','w') as f: json.dump(d, f, ensure_ascii=False, indent=2)
          "
          CDN_BASE_URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$IMG_COMMIT/" python scripts/fill_article.py
        env:
          COVER_URL: "https://cdn.jsdelivr.net/gh/${{ github.repository }}@$IMG_COMMIT/output/cover.jpg"

      - name: S7 Verify
        run: python scripts/report.py

      - name: S8 Save draft to WeChat
        if: hashFiles('output/article.json') != ''
        run: |
          node scripts/wechat-publish.js \
            --server "$WX_SERVER" \
            --secret "$WX_SHARED_SECRET" \
            --appid "$WX_APPID" \
            --appsecret "$WX_APPSECRET" \
            --unlock-password "$WX_UNLOCK_PASSWORD" \
            --file output/article.json
        env:
          WX_SERVER: ${{ secrets.WX_SERVER }}
          WX_SHARED_SECRET: ${{ secrets.WX_SHARED_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_UNLOCK_PASSWORD: ${{ secrets.WX_UNLOCK_PASSWORD }}

      - name: Commit article
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add output/
          git commit -m "daily article $(date +%F)" || echo "nothing to commit"
          git push
