name: Daily Git Repo Article

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: article-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo timeout 120 apt-get update && sudo timeout 60 apt-get install -y fonts-noto-cjk || echo "WARNING: CJK font install skipped (non-blocking, only needed for PIL fallback)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: S1 Search GitHub
        run: python scripts/git_search.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: S2 Research Project
        run: python scripts/git_research.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}

      - name: S3 Write Article
        run: python scripts/git_write.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ARTICLE_AUTHOR: ${{ vars.ARTICLE_AUTHOR }}
          ARTICLE_DIGEST: ${{ vars.ARTICLE_DIGEST }}

      - name: S4 Generate cover
        run: python scripts/git_cover.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: S5 Generate article images
        run: python scripts/gen_article_images.py --prefix git_
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Commit images for CDN
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -f output/git_cover.jpg output/git_images/
          git diff --cached --quiet && echo "no image changes" || git commit -m "git-repo images $(date +%F)"
          STASHED=0
          if [ -n "$(git status --porcelain)" ]; then git stash push -u -m "pipeline-wip"; STASHED=1; fi
          git pull --rebase origin "${{ github.ref_name }}"
          git push
          echo "IMG_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          if [ "$STASHED" = 1 ]; then git stash pop; fi

      - name: S6 Fill image URLs + thumb
        run: |
          CDN_HOST="${{ vars.CDN_HOST || 'cdn.jsdelivr.net' }}"
          export COVER_URL="https://${CDN_HOST}/gh/${{ github.repository }}@${IMG_COMMIT}/output/git_cover.jpg"
          python -c "
          import json, os
          with open('output/git_article.json') as f: d = json.load(f)
          d['articles'][0]['thumb_url'] = os.environ['COVER_URL']
          d['articles'][0]['show_cover_pic'] = 1
          with open('output/git_article.json','w') as f: json.dump(d, f, ensure_ascii=False, indent=2)
          "
          export CDN_BASE_URL="https://${CDN_HOST}/gh/${{ github.repository }}@${IMG_COMMIT}/"
          python scripts/fill_article.py --prefix git_

      - name: S7 Verify
        run: python scripts/report.py --prefix git_

      - name: Commit article
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add output/
          git commit -m "git-repo article $(date +%F)" || echo "nothing to commit"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: S8 Save draft to WeChat
        if: hashFiles('output/git_article.json') != ''
        run: |
          node scripts/wechat-publish.js \
            --server "$WX_SERVER" \
            --secret "$WX_SHARED_SECRET" \
            --appid "$WX_APPID" \
            --appsecret "$WX_APPSECRET" \
            --unlock-password "$WX_UNLOCK_PASSWORD" \
            --file output/git_article.json
        env:
          WX_SERVER: ${{ secrets.WX_SERVER }}
          WX_SHARED_SECRET: ${{ secrets.WX_SHARED_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_UNLOCK_PASSWORD: ${{ secrets.WX_UNLOCK_PASSWORD }}
